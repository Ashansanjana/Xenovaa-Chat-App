name: Build Desktop App

# Builds the Windows Electron installer and (when triggered by a version
# tag) attaches it to a GitHub Release. This does NOT deploy the backend —
# the desktop app still needs VITE_API_URL/VITE_SOCKET_URL in frontend/.env
# pointing at a real, centrally-hosted backend before this build is useful
# to more than one person. See README.md's "Desktop app (Electron)" section.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Build installer
        run: npm run electron:build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload installer as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: xenovaa-chat-windows
          path: frontend/release/*.exe

      - name: Attach installer to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: frontend/release/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
